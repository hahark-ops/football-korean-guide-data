# Research only: measures how quickly balldontlie live scores change.
# The app never reads these results. See research/live/README.md.
# Synced from the private app repository (pipeline/data-repo/); edit it there, not here.
name: live-probe

on:
  schedule:
    # UTC (KST = UTC+9). Each run probes the UTC date one hour after it starts,
    # so the evening runs below start before midnight UTC, away from the busy
    # top of the hour, and still probe the next day's night game. The probe
    # waits for the first kickoff of that date and stops by itself.
    # All runs share one concurrency group: a run that fires while another is
    # running waits for it, so the polling rate never doubles.
    - cron: '20 16 * * 0'  # Sunday early slate (17:00 UTC kickoffs, 18:00 from November)
    - cron: '40 19 * * 0'  # Sunday late slate: queued behind the run above, picks up where it stopped
    - cron: '35 23 * * 0'  # Sunday Night game (Monday UTC date)
    - cron: '35 23 * * 1'  # Monday Night game (Tuesday UTC date)
    - cron: '35 23 * * 4'  # Thursday Night game (Friday UTC date)
  workflow_dispatch:
    inputs:
      date:
        description: 'UTC kickoff date (YYYY-MM-DD). Empty means the UTC date one hour from now.'
        required: false
        default: ''
        type: string

concurrency:
  group: live-probe
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check for the API key
        id: key
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          if [ -z "${BALLDONTLIE_API_KEY}" ]; then
            echo "::notice title=live-probe skipped::The BALLDONTLIE_API_KEY repository secret is not set yet. Add it under Settings > Secrets and variables > Actions to start measuring."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pick the UTC date
        id: date
        if: steps.key.outputs.enabled == 'true'
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          # One hour ahead: a 23:35 UTC start probes the next day's 00:15 kickoff.
          date="${INPUT_DATE:-$(date -u -d '+1 hour' +%F)}"
          if ! [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::date must be YYYY-MM-DD, got '$date'"
            exit 1
          fi
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "Probing UTC date $date"

      - name: Poll live scores
        if: steps.key.outputs.enabled == 'true'
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          PROBE_DATE: ${{ steps.date.outputs.date }}
        run: node research/live/log-scores.mjs --date "$PROBE_DATE" --interval 20 --max-minutes 340

      # The raw log (every API response) never leaves this job. Only the
      # change events from summarize-log.mjs are published: when each state or
      # score change was first seen and the points added. Runs even after a
      # failed or cancelled poll so partial results are kept.
      - name: Commit change events to the probe-logs branch
        if: always() && steps.key.outputs.enabled == 'true' && steps.date.outputs.date != ''
        env:
          PROBE_DATE: ${{ steps.date.outputs.date }}
        run: |
          set -euo pipefail
          log="research/live/logs/${PROBE_DATE}.jsonl"
          summary="$RUNNER_TEMP/changes.jsonl"
          : > "$summary"
          if [ -f "$log" ]; then
            node research/live/summarize-log.mjs "$log" > "$summary"
          fi
          if [ ! -s "$summary" ]; then
            echo "No games were observed; nothing to publish."
            exit 0
          fi
          branch=probe-logs
          worktree="$RUNNER_TEMP/probe-logs"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git fetch --no-tags --depth=1 origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            git worktree add -B "$branch" "$worktree" "origin/$branch"
          else
            # First run: start an orphan branch that shares no history with main.
            git worktree add --detach "$worktree"
            git -C "$worktree" checkout --orphan "$branch"
            git -C "$worktree" rm -r -f -q .
          fi
          mkdir -p "$worktree/changes"
          # Append so a second run for the same date never overwrites earlier results.
          cat "$summary" >> "$worktree/changes/${PROBE_DATE}.jsonl"
          cd "$worktree"
          git add changes
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Live probe changes ${PROBE_DATE}"
          git push origin "HEAD:refs/heads/$branch"
